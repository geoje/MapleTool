networks:
  default:
    external: true
    name: traefik

services:
  prx:
    image: mapletool-prx
    build:
      context: proxy
    volumes:
      - ./proxy/data:/opt/app/data
    deploy:
      update_config:
        order: start-first
        failure_action: rollback
    environment:
      NEXON_API_KEY: ${NEXON_API_KEY:?error}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
    labels:
      traefik.enable: "true"
      traefik.http.services.mapletool-prx.loadbalancer.server.port: 3000
      traefik.http.routers.mapletool-prx.rule: Host(`maple.ygh.kr`) && PathPrefix(`/api`)
      traefik.http.routers.mapletool-prx.entrypoints: websecure
      traefik.http.routers.mapletool-prx.tls: "true"
      traefik.http.routers.mapletool-prx.tls.certresolver: letsencrypt
