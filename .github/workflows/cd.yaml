name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  filter:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      proxy: ${{ steps.filter.outputs.proxy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            frontend:
              - frontend/**
              - .github/workflows/cd.yaml
              - docker-compose-fe.yaml
            proxy:
              - proxy/**
              - .github/workflows/cd.yaml
              - docker-compose-prx.yaml

  frontend:
    needs: filter
    if: ${{ needs.filter.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Nodejs 20
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install modules
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Copy dist
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          source: frontend/dist/, frontend/Dockerfile, frontend/nginx.conf, docker-compose-fe.yaml
          target: ~/${{ github.event.repository.name }}

      - name: Update fe
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          script: |
            cd ~/${{ github.event.repository.name }}
            STACK=$(echo ${{ github.event.repository.name }} | tr '[:upper:]' '[:lower:]')
            docker compose -f docker-compose-fe.yaml build
            docker service ls | grep -qw "${STACK}_fe" && EXISTS="true" || EXISTS="false"
            docker stack deploy --with-registry-auth --detach=${EXISTS} -c docker-compose-fe.yaml "${STACK}"
            [ "${EXISTS}" = "true" ] && docker service update --force --detach=false "${STACK}_fe" || true

  proxy:
    needs: filter
    if: ${{ needs.filter.outputs.proxy == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Nodejs 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: proxy/package-lock.json

      - name: Install modules
        working-directory: proxy
        run: npm ci

      - name: Build
        working-directory: proxy
        run: npm run build

      - name: Prune dev dependencies
        working-directory: proxy
        run: npm prune --omit=dev

      - name: Copy dist
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          source: proxy/dist/, proxy/node_modules/, proxy/package.json, proxy/Dockerfile, docker-compose-prx.yaml
          target: ~/${{ github.event.repository.name }}

      - name: Setup environment variables
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          script: |
            cd ~/${{ github.event.repository.name }}
            cat > .env << 'EOF'
            NEXON_API_KEY=${{ secrets.NEXON_API_KEY }}
            EOF

      - name: Update prx
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          script: |
            cd ~/${{ github.event.repository.name }}
            export $(cat .env)
            STACK=$(echo ${{ github.event.repository.name }} | tr '[:upper:]' '[:lower:]')
            docker compose -f docker-compose-prx.yaml build
            docker service ls | grep -qw "${STACK}_prx" && EXISTS="true" || EXISTS="false"
            docker stack deploy --with-registry-auth --detach=${EXISTS} -c docker-compose-prx.yaml "${STACK}"
            [ "${EXISTS}" = "true" ] && docker service update --force --detach=false "${STACK}_prx" || true
